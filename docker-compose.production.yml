services:
  nirq-web:
    build: .
    ports:
      - "8001:8000"
    restart: unless-stopped
    environment:
      NIRQ_DB_PATH: /data/spectra.sqlite3
      IMPORT_ROOTS: /workspace/imports
      EXPORT_ROOTS: /workspace/exports
      NIRQ_STATIC_DIR: /app/frontend/dist
    volumes:
      - ./data:/data
      - ./exports:/workspace/exports
      - area_import_cifs:/workspace/imports

volumes:
  postgres_data:

  area_import_OLD_cifs:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER_A},password=${SMB_PASS_A},vers=3.0,iocharset=utf8,noperm,uid=0,gid=0,file_mode=0777,dir_mode=0777"
      device: "//192.168.105.66/17检验八部/11公共/近红外光谱采集"

  area_import_cifs:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER_B},password=${SMB_PASS_B},vers=3.0,iocharset=utf8,noperm,uid=0,gid=0,file_mode=0777,dir_mode=0777"
      device: "//192.168.105.82/材料检测中心/11公共/近红外光谱采集"

networks:
  textile-net:
    driver: bridge
